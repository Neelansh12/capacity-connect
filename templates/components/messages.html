{% if messages %}
<div class="fixed top-20 right-4 z-50 flex flex-col gap-2 max-w-md w-full pointer-events-none">
  {% for message in messages %}
  <div class="toast-alert pointer-events-auto p-4 rounded-xl shadow-lg border flex items-start gap-3 transition-all duration-300 {% if message.tags == 'success' %}bg-emerald-50 border-emerald-200 text-emerald-900{% elif message.tags == 'error' %}bg-rose-50 border-rose-200 text-rose-900{% elif message.tags == 'warning' %}bg-amber-50 border-amber-200 text-amber-900{% else %}bg-blue-50 border-blue-200 text-blue-900{% endif %}">
    <div class="flex-shrink-0 mt-0.5">
      {% if message.tags == 'success' %}
      <i data-lucide="check-circle" class="w-5 h-5 text-emerald-600"></i>
      {% elif message.tags == 'error' %}
      <i data-lucide="alert-circle" class="w-5 h-5 text-rose-600"></i>
      {% elif message.tags == 'warning' %}
      <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-600"></i>
      {% else %}
      <i data-lucide="info" class="w-5 h-5 text-blue-600"></i>
      {% endif %}
    </div>
    <div class="flex-1 text-sm font-medium">
      {{ message }}
    </div>
    <button type="button" onclick="this.parentElement.remove()" class="text-gov-400 hover:text-gov-600 focus:outline-none">
      <i data-lucide="x" class="w-4 h-4"></i>
    </button>
  </div>
  {% endfor %}
</div>
{% endif %}
