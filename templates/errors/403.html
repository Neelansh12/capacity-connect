{% extends 'base.html' %}
{% block title %}403 Forbidden — Capacity Connect{% endblock %}
{% block public_content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 text-center">
  <div class="max-w-md w-full bg-white p-8 rounded-2xl border border-gov-200 shadow-xl space-y-4">
    <div class="w-16 h-16 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto text-2xl font-bold">403</div>
    <h1 class="text-2xl font-bold text-gov-900">Access Restricted</h1>
    <p class="text-xs text-gov-600">{{ exception|default:"You do not possess the required institutional role or permissions to view this resource." }}</p>
    <a href="{% url 'core:landing' %}" class="btn-primary text-xs inline-block">Return to Home</a>
  </div>
</div>
{% endblock %}
